[package]
name = "store-stream"
version = "0.1.0"
edition = "2021"
description = "Parted storage for large files to S3"
license = "MIT"
repository = "https://github.com/wavey-ai/store-stream"
readme = "README.md"

[dependencies]
tokio = { version = "1.37.0", features = ["sync", "macros"] }
aws-sdk-s3 = { version = ">=1.40.0, <1.68.0", features = ["behavior-version-latest"] }
# Keep the AWS runtime family on the Rust-1.89-compatible line for downstream
# crates that resolve store-stream without this repository's Cargo.lock.
aws-credential-types = ">=1.2.0, <1.2.2"
aws-runtime = ">=1.5.0, <1.5.3"
aws-sigv4 = ">=1.2.0, <1.2.7"
aws-smithy-async = ">=1.2.0, <1.2.4"
aws-smithy-eventstream = ">=0.60.0, <0.60.6"
aws-smithy-http = ">=0.60.0, <0.60.13"
aws-smithy-json = ">=0.61.0, <0.61.10"
aws-smithy-runtime = ">=1.7.0, <1.7.7"
aws-smithy-runtime-api = ">=1.7.0, <1.7.4"
aws-smithy-types = ">=1.2.0, <1.2.12"
aws-smithy-xml = ">=0.60.0, <0.60.10"
aws-types = ">=1.3.0, <1.3.4"
bytes = "1.6.0"
anyhow = "1.0.86"
tracing = "0.1.40"
